global:
  scrape_interval: 15s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: jellyfin-egress
    static_configs:
      - targets: ["jellyfin-egress-exporter:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
