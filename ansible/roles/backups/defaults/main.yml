---
backups_appdata_dir: /home/{{ ansible_user }}/appdata
backups_env_file: /etc/homelab/backup.env
backups_staging_dir: /var/backups/homelab
backups_repositories:
  - name: nas
    url: /mnt/appdata/restic
  - name: s3
    url: s3:s3.ap-southeast-2.amazonaws.com/reilley-homelab-backups
backups_paths:
  - "{{ backups_appdata_dir }}"
  - "{{ backups_staging_dir }}"
  - /etc
backups_excludes:
  - "{{ backups_appdata_dir }}/jellyfin/cache"
  - "{{ backups_appdata_dir }}/jellyfin/data/data/introskipper/introskipper-cache.db"
  - "{{ backups_appdata_dir }}/selfless/images"
  - "{{ backups_appdata_dir }}/prometheus"
  - "{{ backups_appdata_dir }}/loki"
  - "{{ backups_appdata_dir }}/tempo"
  - "{{ backups_appdata_dir }}/postgres"
  - "{{ backups_appdata_dir }}/jellyfin/data/data/jellyfin.db*"
  - "{{ backups_appdata_dir }}/bitwarden/db.sqlite3*"
  - "{{ backups_appdata_dir }}/arcto/vaultwarden/db.sqlite3*"
backups_sqlite_databases:
  - name: jellyfin
    path: "{{ backups_appdata_dir }}/jellyfin/data/data/jellyfin.db"
  - name: bitwarden
    path: "{{ backups_appdata_dir }}/bitwarden/db.sqlite3"
  - name: arcto-vaultwarden
    path: "{{ backups_appdata_dir }}/arcto/vaultwarden/db.sqlite3"
backups_retention: --keep-daily 7 --keep-weekly 4 --keep-monthly 12
backups_textfile_dir: /var/lib/node_exporter/textfile_collector
