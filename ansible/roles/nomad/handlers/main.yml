---
- name: Reload networkd for the internal interface
  ansible.builtin.command: networkctl reload
  changed_when: true

- name: Load the bridge sysctls
  ansible.builtin.command: sysctl --load /etc/sysctl.d/90-nomad-bridge.conf
  changed_when: true

- name: Reload systemd for nomad
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart nomad
  ansible.builtin.systemd_service:
    name: nomad.service
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
