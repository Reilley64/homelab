---
base_portage_common_flags: >-
  -march=alderlake -mabm -mno-kl -mno-sgx -mno-widekl -mshstk
  --param=l1-cache-line-size=64 --param=l1-cache-size=48 --param=l2-cache-size=18432
  -O2 -pipe
base_portage_makeopts: -j8
base_portage_cpu_flags_x86: aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq
base_portage_video_cards: intel
